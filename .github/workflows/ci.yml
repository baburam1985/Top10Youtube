name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest black ruff

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Format (black)
        run: |
          black --check .

      - name: Tests (pytest)
        env:
          # Ensure tests do not depend on real credentials in CI.
          ANTHROPIC_API_KEY: "test"
          ELEVEN_API_KEY: "test"
          TAVILY_API_KEY: "test"
          REPLICATE_API_TOKEN: "test"
        run: |
          pytest -q
